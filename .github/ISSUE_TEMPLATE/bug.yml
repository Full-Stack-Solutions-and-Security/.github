name: Bug melden
description: Meld een fout die je hebt vastgesteld
type: Bug
body:
  - type: textarea
    id: wat
    attributes:
      label: Wat ging er mis?
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Stappen om te reproduceren
      placeholder: "1. Ga naar …\n2. Klik op …"
    validations:
      required: true
  - type: textarea
    id: verwacht
    attributes:
      label: Wat had je verwacht?
  - type: input
    id: omgeving
    attributes:
      label: Browser / toestel / versie
